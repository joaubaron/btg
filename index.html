/* =========================================================
   CONFIGURAÇÕES GLOBAIS
========================================================= */
const CFG = {
  PATRIMONIO_TOTAL: 32000000,
  TESOURO_IPCA: 20000000,
  SELIC_INICIAL: 12000000,
  RATEIO: { casa: 0.76, esposa: 0.12, marido: 0.12 },
  CUSTO_BTG_AA: 0.003,
  IR_FAIXAS: [
    { maxDias: 180, aliq: 0.225 },
    { maxDias: 360, aliq: 0.20 },
    { maxDias: 720, aliq: 0.175 },
    { maxDias: Infinity, aliq: 0.15 }
  ],
  VALIDACAO: { selicMin: 6, selicMax: 20, ipcaMin: 1.5, ipcaMax: 15 },
  FALLBACK: { selic: 12.0, ipca: 5.0, rentSelicLiq: 10.5, taxaRealIPCA: 6.0 },
  STORAGE_KEY: 'gestao_v31',
  API_TIMEOUT: 8000,
  PDF: { rentLiqMin: 8.5, rentLiqMax: 10.0, rendMin: 2720000, rendMax: 3200000, taxaRetiradaSegura: 4.0 }
};

let chartAlocacao = null, chartProjecao = null, estado = null;
let dadosBCB = { selic: null, ipca: null, selicData: null, ipcaData: null, online: false, valido: false };
let decisoes = [];   // sempre array

/* =========================================================
   PERSISTÊNCIA
========================================================= */
function salvarEstado() {
  try {
    localStorage.setItem(CFG.STORAGE_KEY, JSON.stringify({ inputs: coletarInputs(), decisoes, ts: Date.now() }));
  } catch (e) {}
}
function carregarEstado() {
  try {
    const raw = localStorage.getItem(CFG.STORAGE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    decisoes = Array.isArray(d.decisoes) ? d.decisoes : [];
    return d.inputs || null;
  } catch { return null; }
}
function limparStorage() {
  if (confirm('Apagar todos os dados salvos?')) { localStorage.removeItem(CFG.STORAGE_KEY); location.reload(); }
}
function exportarJSON() {
  const blob = new Blob([JSON.stringify({ inputs: coletarInputs(), decisoes, dadosBCB, ts: Date.now() }, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url;
  a.download = `gestao_${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url);
}
function importarJSON(ev) {
  const file = ev.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      decisoes = Array.isArray(data.decisoes) ? data.decisoes : [];
      if (data.inputs) { aplicarInputs(data.inputs); salvarEstado(); atualizarSimulacao(); renderizarDecisoes(); alert('Importado!'); }
    } catch { alert('Arquivo inválido.'); }
  };
  reader.readAsText(file);
}

/* =========================================================
   SERVICE WORKER
========================================================= */
function setSWStatus(ativo, msg) {
  const wrap = document.getElementById('sw-status'), dot = document.getElementById('sw-dot'), label = document.getElementById('sw-label');
  if (!wrap) return;
  wrap.classList.remove('hidden'); wrap.classList.add('flex');
  dot.className = 'w-1.5 h-1.5 rounded-full ' + (ativo ? 'bg-emerald-400' : 'bg-slate-500');
  label.textContent = msg || (ativo ? 'sw on' : 'sw off');
}
async function registrarSW() {
  if (location.protocol === 'file:' || !('serviceWorker' in navigator)) { setSWStatus(false, 'sw off'); return; }
  try { await navigator.serviceWorker.register('./sw.js', { scope: './' }); setSWStatus(true, 'sw on'); }
  catch { setSWStatus(false, 'sw off'); }
}
async function forcarAtualizacaoSW() {
  if (!('serviceWorker' in navigator)) { fecharConfig(); return; }
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    if (reg) { await reg.update(); alert('Atualização solicitada. Recarregue.'); }
    else alert('Nenhum SW registrado.');
  } catch (e) { alert('Erro: ' + e.message); }
  fecharConfig();
}

/* =========================================================
   API BCB
========================================================= */
async function fetchBCB(serie) {
  const url = `https://api.bcb.gov.br/dados/serie/bcdata.sgs.${serie}/dados/ultimos/1?formato=json`;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), CFG.API_TIMEOUT);
  try {
    const r = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const json = await r.json();
    if (!json || !json.length) return null;
    return { valor: parseFloat(String(json[0].valor).replace(',', '.')), data: json[0].data };
  } catch { return null; } finally { clearTimeout(timer); }
}
async function atualizarDadosBCB() {
  const dot = document.getElementById('api-dot'), label = document.getElementById('api-label');
  dot.className = 'w-1.5 h-1.5 rounded-full bg-amber-400 badge-live';
  label.textContent = 'carregando...';
  const [selic, ipca] = await Promise.all([fetchBCB(432), fetchBCB(13522)]);
  const selicValida = selic && selic.valor >= CFG.VALIDACAO.selicMin && selic.valor <= CFG.VALIDACAO.selicMax;
  const ipcaValido = ipca && ipca.valor >= CFG.VALIDACAO.ipcaMin && ipca.valor <= CFG.VALIDACAO.ipcaMax;
  dadosBCB.online = !!(selic || ipca); dadosBCB.valido = selicValida && ipcaValido;
  dot.className = 'w-1.5 h-1.5 rounded-full ' + (dadosBCB.valido ? 'bg-emerald-400' : dadosBCB.online ? 'bg-amber-400' : 'bg-rose-400');
  label.textContent = dadosBCB.valido ? 'BCB online' : dadosBCB.online ? 'BCB parcial' : 'BCB offline';

  if (selicValida) {
    dadosBCB.selic = selic.valor; dadosBCB.selicData = selic.data;
    document.getElementById('ind-selic').textContent = selic.valor.toFixed(2) + '%';
    document.getElementById('ind-selic-data').textContent = 'em ' + selic.data;
  } else {
    dadosBCB.selic = CFG.FALLBACK.selic;
    document.getElementById('ind-selic').textContent = CFG.FALLBACK.selic.toFixed(2) + '%*';
    document.getElementById('ind-selic-data').textContent = selic ? '*fora da faixa' : '*sem conexão';
  }
  if (ipcaValido) {
    dadosBCB.ipca = ipca.valor; dadosBCB.ipcaData = ipca.data;
    document.getElementById('ind-ipca').textContent = ipca.valor.toFixed(2) + '%';
    document.getElementById('ind-ipca-data').textContent = 'em ' + ipca.data;
  } else {
    dadosBCB.ipca = CFG.FALLBACK.ipca;
    document.getElementById('ind-ipca').textContent = CFG.FALLBACK.ipca.toFixed(2) + '%*';
    document.getElementById('ind-ipca-data').textContent = ipca ? '*fora da faixa' : '*sem conexão';
  }
  atualizarSimulacao();
}
function forcarAtualizacaoAPI() { atualizarDadosBCB(); fecharConfig(); }

/* =========================================================
   IR
========================================================= */
function calcularIR(dias) {
  for (const f of CFG.IR_FAIXAS) { if (dias <= f.maxDias) return f.aliq; }
  return 0.15;
}
function diasDesde(dataStr) {
  if (!dataStr) return 800;
  const d = new Date(dataStr + 'T12:00:00');
  if (isNaN(d.getTime())) return 800;
  return Math.max(0, Math.floor((Date.now() - d.getTime()) / 86400000));
}

/* =========================================================
   CÁLCULOS
========================================================= */
function calcularCupomIPCA(valorIPCA, taxaRealAnual) {
  if (!isFinite(valorIPCA) || !isFinite(taxaRealAnual)) return 0;
  return valorIPCA * (Math.pow(1 + taxaRealAnual, 0.5) - 1);
}
function proximoPagamentoCupom(dataBase) {
  const d = new Date(dataBase);
  if (isNaN(d.getTime())) return new Date();
  const ano = d.getFullYear();
  const fev = new Date(ano, 1, 15), ago = new Date(ano, 7, 15), proxAnoFev = new Date(ano + 1, 1, 15);
  if (d <= fev) return fev;
  if (d <= ago) return ago;
  return proxAnoFev;
}

========================================================= */

  const sel = document.getElementById('select-saque').value;
  const num = (id, def) => {
    const v = parseFloat(document.getElementById(id)?.value);
    return isFinite(v) ? v : def;
  };
  return {
    patrimonioTotal: num('input-patrimonio', CFG.PATRIMONIO_TOTAL),
    jaInvestido: num('input-ja-investido', CFG.PATRIMONIO_TOTAL),
    selicInicial: num('input-selic-inicial', CFG.SELIC_INICIAL),
    ipcaInicial: num('input-ipca-inicial', CFG.TESOURO_IPCA),
    dataBase: document.getElementById('input-data-base')?.value || '',
    dataAporte: document.getElementById('input-data-aporte')?.value || '',
    rentSelic: num('input-rent-selic', 10.5),
    taxaRealIPCA: num('input-taxa-real-ipca', 6.0),
    rentIPCA: num('input-rent-ipca', 10.7),
    custoBTG: num('input-custo-btg', 0.3),
    irEfetivo: num('input-ir-efetivo', 15),
    saqueSelect: sel,
    saqueCustom: num('input-saque-custom', 130000),
    pisoSaque: num('input-piso-saque', 0),
    metaSelic: num('input-meta-selic', 12000000),
    rateioCasa: num('input-rateio-casa', 76),
    rateioEsposa: num('input-rateio-esposa', 12),
    rateioMarido: num('input-rateio-marido', 12),
    extraImovel: num('input-extra-imovel', 0),
    extraOutros: num('input-extra-outros', 0),
    reservaEmergencia: num('input-reserva-emergencia', 0)
  };
}
function aplicarInputs(inp) {
  if (!inp) return;
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = v; };
  set('input-patrimonio', inp.patrimonioTotal || CFG.PATRIMONIO_TOTAL);
  set('input-ja-investido', inp.jaInvestido || CFG.PATRIMONIO_TOTAL);
  set('input-selic-inicial', inp.selicInicial || CFG.SELIC_INICIAL);
  set('input-ipca-inicial', inp.ipcaInicial || CFG.TESOURO_IPCA);
  if (inp.dataBase) set('input-data-base', inp.dataBase);
  if (inp.dataAporte) set('input-data-aporte', inp.dataAporte);
  set('input-rent-selic', inp.rentSelic || 10.5);
  set('input-taxa-real-ipca', inp.taxaRealIPCA || 6.0);
  set('input-rent-ipca', inp.rentIPCA || 10.7);
  set('input-custo-btg', inp.custoBTG ?? 0.3);
  set('input-ir-efetivo', inp.irEfetivo ?? 15);
  set('select-saque', inp.saqueSelect || '130000');
  set('input-saque-custom', inp.saqueCustom || 130000);
  set('input-piso-saque', inp.pisoSaque || 0);
  set('input-meta-selic', inp.metaSelic || 12000000);
  set('input-rateio-casa', inp.rateioCasa ?? 76);
  set('input-rateio-esposa', inp.rateioEsposa ?? 12);
  set('input-rateio-marido', inp.rateioMarido ?? 12);
  set('input-extra-imovel', inp.extraImovel || 0);
  set('input-extra-outros', inp.extraOutros || 0);
  set('input-reserva-emergencia', inp.reservaEmergencia || 0);
  document.getElementById('div-saque-custom').classList.toggle('hidden', inp.saqueSelect !== 'custom');
  document.getElementById('val-rent-selic').textContent = (inp.rentSelic || 10.5).toFixed(1) + '%';
  document.getElementById('val-taxa-real-ipca').textContent = (inp.taxaRealIPCA || 6.0).toFixed(1) + '%';
  document.getElementById('val-rent-ipca').textContent = (inp.rentIPCA || 10.7).toFixed(1) + '%';
  atualizarSomaAlocada();
}

/* =========================================================

function atualizarSomaAlocada() {
  const total = parseFloat(document.getElementById('input-patrimonio').value) || 0;
  const selic = parseFloat(document.getElementById('input-selic-inicial').value) || 0;
  const ipca = parseFloat(document.getElementById('input-ipca-inicial').value) || 0;
  const soma = selic + ipca;
  document.getElementById('soma-alocada').textContent = formatarMoeda(soma);
  const el = document.getElementById('aviso-soma');
  if (Math.abs(soma - total) < 1) { el.textContent = '✓ ok'; el.className = 'text-emerald-400'; }
  else if (soma > total) { el.textContent = '⚠ excede'; el.className = 'text-rose-400'; }
  else { el.textContent = '⚠ falta ' + formatarMoeda(total - soma); el.className = 'text-amber-400'; }
}
function igualarAlocacaoTotal() {
  const total = parseFloat(document.getElementById('input-patrimonio').value) || 0;
  const selic = parseFloat(document.getElementById('input-selic-inicial').value) || 0;
  document.getElementById('input-ipca-inicial').value = Math.round(Math.max(0, total - selic));
  atualizarSomaAlocada(); atualizarSimulacao();
}
function atualizarRateioInfo() {
  const c = parseFloat(document.getElementById('input-rateio-casa').value) || 0;
  const e = parseFloat(document.getElementById('input-rateio-esposa').value) || 0;
  const m = parseFloat(document.getElementById('input-rateio-marido').value) || 0;
  const soma = c + e + m;

  el.className = 'text-[10px] block mt-0.5 ' + (Math.abs(soma - 100) < 0.5 ? 'text-emerald-400' : 'text-rose-400');
}

/* Recalcula o nominal do slider IPCA+ a partir da taxa real — com clamp no min/max do slider */
function recalcularIPCANominal() {
  const realEl = document.getElementById('input-taxa-real-ipca');
  const nominalEl = document.getElementById('input-rent-ipca');
  if (!realEl || !nominalEl) return;
  const real = (parseFloat(realEl.value) || 6.0) / 100;
  const ipca = (dadosBCB.ipca || CFG.FALLBACK.ipca) / 100;
  let nominal = ((1 + real) * (1 + ipca) - 1) * 100;
  const min = parseFloat(nominalEl.min) || 6;
  const max = parseFloat(nominalEl.max) || 14;
  nominal = Math.min(max, Math.max(min, nominal));
  nominalEl.value = nominal.toFixed(1);
  document.getElementById('val-rent-ipca').textContent = nominal.toFixed(1) + '%';
  const calcEl = document.getElementById('ipca-nominal-calc');
  if (calcEl) calcEl.textContent = nominal.toFixed(2) + '%';
}

/* =========================================================
   SAÚDE
========================================================= */
function calcularSaude(patrimonioTotal, rendTotalLiq, ipcaProjetado, saqueMensal, saldoSelic, metaSelic) {
  const safe = (v, d=0) => isFinite(v) ? v : d;
  patrimonioTotal = safe(patrimonioTotal, 1);
  rendTotalLiq = safe(rendTotalLiq, 0);
  ipcaProjetado = safe(ipcaProjetado, 5);
  saqueMensal = safe(saqueMensal, 0);
  saldoSelic = safe(saldoSelic, 0);
  metaSelic = safe(metaSelic, 0);

  const saqueAnual = saqueMensal * 12;
  const rentNominalLiq = rendTotalLiq / patrimonioTotal * 100;
  const retornoReal = ((1 + rentNominalLiq/100) / (1 + ipcaProjetado/100) - 1) * 100;
  const taxaRetirada = saqueAnual / patrimonioTotal * 100;
  let saldo = patrimonioTotal, anos = 0;
  const retornoRealMensal = Math.pow(1 + retornoReal/100, 1/12) - 1;
  const maxAnos = 100;
  while (saldo > 0 && anos < maxAnos) {
    for (let m = 0; m < 12 && saldo > 0; m++) saldo = saldo * (1 + retornoRealMensal) - saqueMensal;
    anos++;
  }
  const poderCompra10 = patrimonioTotal / Math.pow(1 + ipcaProjetado/100, 10);
  return { rentNominalLiq, retornoReal, taxaRetirada, durabilidade: anos, poderCompra10, saqueAnual };
}
function renderizarSaude(s, saldoSelic, metaSelic) {
  const elReal = document.getElementById('saude-retorno-real');
  if (!elReal) return;
  elReal.textContent = (s.retornoReal >= 0 ? '+' : '') + s.retornoReal.toFixed(2) + '% a.a.';
  elReal.className = 'text-lg font-bold ' + (s.retornoReal >= 2 ? 'text-emerald-400' : s.retornoReal >= 0 ? 'text-amber-400' : 'text-rose-400');
  document.getElementById('saude-retorno-real-desc').textContent = s.retornoReal >= 0 ? 'Ganha da inflação' : 'Perde para a inflação';

  const elTx = document.getElementById('saude-tx-retirada');
  elTx.textContent = s.taxaRetirada.toFixed(2) + '% a.a.';
  elTx.className = 'text-lg font-bold ' + (s.taxaRetirada <= 4 ? 'text-emerald-400' : s.taxaRetirada <= 6 ? 'text-amber-400' : 'text-rose-400');
  document.getElementById('saude-tx-retirada-desc').textContent = s.taxaRetirada <= 4 ? 'Abaixo da taxa segura (4%)' : s.taxaRetirada <= 6 ? 'Zona de atenção' : 'Acima do sustentável';

  const elDur = document.getElementById('saude-durabilidade');
  elDur.textContent = s.durabilidade >= 100 ? '∞ (perpétuo)' : s.durabilidade + ' anos';
  elDur.className = 'text-lg font-bold ' + (s.durabilidade >= 50 ? 'text-emerald-400' : s.durabilidade >= 25 ? 'text-amber-400' : 'text-rose-400');
  document.getElementById('saude-durabilidade-desc').textContent = s.durabilidade >= 100 ? 'Principal preservado' : s.durabilidade >= 50 ? 'Décadas' : s.durabilidade >= 25 ? 'Uma geração' : 'Risco de exaustão';

  document.getElementById('saude-poder-compra').textContent = formatarMoeda(s.poderCompra10);
  document.getElementById('saude-poder-compra-desc').textContent = 'Preços de hoje';

  const preservaPrincipal = s.retornoReal >= 0 && s.taxaRetirada <= 5;
  const preservaReal = s.retornoReal >= 2;
  const reservaOk = saldoSelic >= metaSelic;

  setCard('saude-card-principal', 'saude-dot-principal', 'saude-txt-principal', preservaPrincipal,
    preservaPrincipal ? `Sim. Retorno real ${s.retornoReal.toFixed(1)}% e retirada ${s.taxaRetirada.toFixed(1)}%.`
    : s.retornoReal < 0 ? `Não. Retorno real negativo (${s.retornoReal.toFixed(1)}%).`
    : `Risco. Retirada de ${s.taxaRetirada.toFixed(1)}% acima do sustentável.`);
  setCard('saude-card-real', 'saude-dot-real', 'saude-txt-real', preservaReal,
    preservaReal ? `Sim. Ganho real de ${s.retornoReal.toFixed(1)}% a.a.`
    : s.retornoReal >= 0 ? `Marginal. Apenas ${s.retornoReal.toFixed(1)}%.`
    : `Não. Perde ${Math.abs(s.retornoReal).toFixed(1)}% a.a.`);
  setCard('saude-card-reserva', 'saude-dot-reserva', 'saude-txt-reserva', reservaOk,
    reservaOk ? `Sim. Selic ${formatarMoeda(saldoSelic)} ≥ meta.`
    : `Não. Selic ${formatarMoeda(saldoSelic)} < meta ${formatarMoeda(metaSelic)}.`);

  const v = document.getElementById('saude-veredito');
  if (preservaPrincipal && preservaReal && reservaOk) { v.textContent = '✓ SAUDÁVEL'; v.className = 'text-xs font-bold px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-700/50'; }
  else { v.textContent = '⚠ ATENÇÃO'; v.className = 'text-xs font-bold px-3 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-700/50'; }
}
function setCard(cardId, dotId, txtId, ok, texto) {
  const dot = document.getElementById(dotId), card = document.getElementById(cardId), txt = document.getElementById(txtId);
  if (!dot || !card || !txt) return;
  dot.className = 'w-2 h-2 rounded-full ' + (ok ? 'bg-emerald-400' : 'bg-rose-400');
  card.className = 'p-3 rounded-xl border ' + (ok ? 'bg-emerald-950/20 border-emerald-800/40' : 'bg-rose-950/20 border-rose-800/40');
  txt.textContent = texto;
}

/* =========================================================
   ENCONTRAR SAQUE SUSTENTÁVEL
========================================================= */
function encontrarSaqueSustentavel() {
  const inputs = coletarInputs();
  const patrimonioTotal = inputs.patrimonioTotal;
  const ipcaProjetado = dadosBCB.ipca || CFG.FALLBACK.ipca;
  const rendTotalLiq = inputs.selicInicial * (inputs.rentSelic/100) + inputs.ipcaInicial * (inputs.rentIPCA/100);
  const rentNominalLiq = rendTotalLiq / patrimonioTotal * 100;
  const retornoReal = ((1 + rentNominalLiq/100) / (1 + ipcaProjetado/100) - 1) * 100;
  const taxaMax = Math.min(Math.max(retornoReal, 0), 4.5);
  const saqueMax = patrimonioTotal * (taxaMax/100) / 12;
  const saqueArredondado = Math.max(0, Math.floor(saqueMax / 1000) * 1000);
  document.getElementById('select-saque').value = 'custom';
  document.getElementById('div-saque-custom').classList.remove('hidden');
  document.getElementById('input-saque-custom').value = saqueArredondado;
  atualizarSimulacao();
  alert(`Saque sustentável calculado:\n\nR$ ${saqueArredondado.toLocaleString('pt-BR')}/mês\n\nBase: retorno real ${retornoReal.toFixed(2)}% a.a. (limitado a 4,5%)\nTaxa de retirada: ${taxaMax.toFixed(2)}%`);
}

/* =========================================================
   HISTÓRICO
========================================================= */
function adicionarDecisao() {
  const texto = prompt('Descreva a decisão:');
  if (!texto) return;
  decisoes.unshift({ data: new Date().toISOString(), texto });
  salvarEstado(); renderizarDecisoes();
}
function removerDecisao(idx) {
  if (!confirm('Remover esta decisão?')) return;
  decisoes.splice(idx, 1); salvarEstado(); renderizarDecisoes();
}
function renderizarDecisoes() {
  const el = document.getElementById('lista-decisoes');
  if (!el) return;
  if (!Array.isArray(decisoes) || !decisoes.length) {
    el.innerHTML = '<p class="text-slate-500 italic">Nenhuma decisão registrada ainda. Use o botão + Adicionar após reuniões com o BTG.</p>';
    return;
  }
  el.innerHTML = decisoes.map((d, i) => `
    <div class="flex justify-between items-start gap-2 p-2 rounded bg-slate-900/60 border border-slate-800">
      <div class="flex-1">
        <span class="text-[10px] text-slate-500 block">${new Date(d.data).toLocaleString('pt-BR')}</span>
        <span class="text-slate-200">${escapeHtml(d.texto)}</span>
      </div>
      <button onclick="removerDecisao(${i})" class="text-rose-400 hover:text-rose-300 text-xs">✕</button>
    </div>
  `).join('');
}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* =========================================================
   SIMULAÇÃO PRINCIPAL
========================================================= */
function atualizarSimulacao() {
  try {
    const inputs = coletarInputs();
    estado = estado || { inputs: {} };
    estado.inputs = { ...estado.inputs, ...inputs };
    atualizarSomaAlocada(); atualizarRateioInfo();

    const patrimonioTotal = inputs.patrimonioTotal;
    const selicBase = inputs.selicInicial;
    const ipcaBase = inputs.ipcaInicial;
    const metaSelic = inputs.metaSelic;

    const saqueMensal = inputs.saqueSelect === 'custom' ? inputs.saqueCustom : (parseFloat(inputs.saqueSelect) || 130000);

    const rendSelicLiq = selicBase * (inputs.rentSelic / 100);
    const rendIPCALiq = ipcaBase * (inputs.rentIPCA / 100);
    const rendTotalLiq = rendSelicLiq + rendIPCALiq;

    const totalExtra = inputs.extraImovel + inputs.extraOutros;
    const saldoSelicAtual = Math.max(0, selicBase - totalExtra);

    const dataBase = inputs.dataBase ? new Date(inputs.dataBase + 'T12:00:00') : new Date();

    const dias = diasDesde(inputs.dataAporte);
    const aliqIR = inputs.irEfetivo > 0 ? (inputs.irEfetivo / 100) : calcularIR(dias);
    const irInfoEl = document.getElementById('ir-info');
    if (irInfoEl) irInfoEl.textContent = inputs.dataAporte
      ? `${dias} dias desde aporte → IR ${(aliqIR*100).toFixed(1)}%`
      : 'Informe a data para calcular IR regressivo';

    const rendMensalTotal = rendTotalLiq / 12;
    const propRendimento = rendMensalTotal / (patrimonioTotal + rendMensalTotal);
    const rendimentoNoResgate = saqueMensal * propRendimento;
    const irMensal = rendimentoNoResgate * aliqIR;
    const resgateBruto = saqueMensal + irMensal;
    const custoMensal = patrimonioTotal * ((inputs.custoBTG/100) / 12);

    const saqueAnual = saqueMensal * 12;
    const sobraAnual = rendTotalLiq - saqueAnual;

    const ipcaProjetado = dadosBCB.ipca || CFG.FALLBACK.ipca;
    const rentIPCAReal = Math.max(0, ((1 + inputs.rentIPCA/100) / (1 + ipcaProjetado/100)) - 1);
    const cupomLiq = calcularCupomIPCA(ipcaBase, rentIPCAReal);
    const proxCupom = proximoPagamentoCupom(dataBase);

    const somaRateio = inputs.rateioCasa + inputs.rateioEsposa + inputs.rateioMarido;
    const rCasa = somaRateio > 0 ? inputs.rateioCasa / somaRateio : CFG.RATEIO.casa;
    const rEsposa = somaRateio > 0 ? inputs.rateioEsposa / somaRateio : CFG.RATEIO.esposa;
    const rMarido = somaRateio > 0 ? inputs.rateioMarido / somaRateio : CFG.RATEIO.marido;
    const vCasa = saqueMensal * rCasa;
    const vEsposa = saqueMensal * rEsposa;
    const vMarido = saqueMensal * rMarido;

    document.getElementById('header-base').textContent = formatarMoeda(patrimonioTotal);
    document.getElementById('header-data').textContent = dataBase.toLocaleDateString('pt-BR');
    document.getElementById('ind-rend-selic').textContent = formatarMoeda(rendSelicLiq) + '/ano';
    document.getElementById('ind-rend-selic-base').textContent = formatarMoeda(selicBase) + ' · já c/ IR';
    document.getElementById('ind-rend-ipca').textContent = formatarMoeda(rendIPCALiq) + '/ano';
    document.getElementById('ind-rend-ipca-base').textContent = formatarMoeda(ipcaBase) + ' · já c/ IR';
    document.getElementById('metric-rendimento').textContent = formatarMoeda(rendTotalLiq) + '/ano';
    document.getElementById('metric-saque-anual').textContent = formatarMoeda(saqueAnual) + '/ano';
    document.getElementById('metric-saldo-selic').textContent = formatarMoeda(saldoSelicAtual);

    const sobraEl = document.getElementById('metric-sobra');
    sobraEl.textContent = (sobraAnual >= 0 ? '+ ' : '') + formatarMoeda(sobraAnual) + '/ano';
    sobraEl.className = 'text-base font-bold ' + (sobraAnual >= 0 ? 'text-amber-400' : 'text-red-400');

    document.getElementById('ir-aliquota').textContent = (aliqIR * 100).toFixed(1) + '%';
    document.getElementById('ir-valor').textContent = formatarMoeda(irMensal);
    document.getElementById('custos-btg').textContent = formatarMoeda(custoMensal);
    document.getElementById('resgate-bruto').textContent = formatarMoeda(resgateBruto);

    document.getElementById('cupom-valor').textContent = formatarMoeda(cupomLiq);
    document.getElementById('cupom-prox').textContent = proxCupom.toLocaleDateString('pt-BR');
    const selicAbaixoMeta = saldoSelicAtual < metaSelic;
    document.getElementById('cupom-destino').textContent = selicAbaixoMeta ? '⚠ Recompor Selic' : 'Reinvestir/Livre';
    document.getElementById('cupom-destino').className = 'text-[10px] font-bold ' + (selicAbaixoMeta ? 'text-amber-400' : 'text-emerald-400');

    document.getElementById('dist-casa').textContent = formatarMoeda(vCasa);
    document.getElementById('dist-esposa').textContent = formatarMoeda(vEsposa);
    document.getElementById('dist-marido').textContent = formatarMoeda(vMarido);
    document.getElementById('fluxo-bruto').textContent = formatarMoeda(resgateBruto);
    document.getElementById('fluxo-total').textContent = formatarMoeda(saqueMensal);
    document.getElementById('fluxo-casa').textContent = formatarMoeda(vCasa);
    document.getElementById('fluxo-esposa').textContent = formatarMoeda(vEsposa);
    document.getElementById('fluxo-marido').textContent = formatarMoeda(vMarido);
    document.getElementById('rec-saque-bruto').textContent = 'bruto: ' + formatarMoeda(resgateBruto);

    const saude = calcularSaude(patrimonioTotal, rendTotalLiq, ipcaProjetado, saqueMensal, saldoSelicAtual, metaSelic);
    renderizarSaude(saude, saldoSelicAtual, metaSelic);

    renderizarProjecao(saldoSelicAtual, metaSelic, rendSelicLiq, cupomLiq, saqueMensal, dataBase);
    avaliarRegraAcao(saqueMensal, sobraAnual, saldoSelicAtual, metaSelic, resgateBruto, rendTotalLiq, inputs.pisoSaque);
    atualizarGrafico(saldoSelicAtual, metaSelic, selicBase, ipcaBase);
    salvarEstado();
  } catch (e) {
    console.error('[atualizarSimulacao] erro:', e);
  }
}

/* =========================================================
   PROJEÇÃO
========================================================= */
function renderizarProjecao(saldoSelic, meta, rendSelicAnual, cupomSemestral, saqueMensal, dataBase) {
  const el = document.getElementById('projecao-conteudo');
  if (!el) return;
  const rendMensal = rendSelicAnual / 12;
  const resgateBrutoMensal = saqueMensal * 1.02;
  if (saldoSelic >= meta) {
    el.innerHTML = `<span class="text-emerald-400">✓ Reserva Selic na meta (${formatarMoeda(saldoSelic)} ≥ ${formatarMoeda(meta)}).</span> Cupons podem ser reinvestidos.`;
    return;
  }
  const deficit = meta - saldoSelic;
  const sobraMensal = rendMensal - resgateBrutoMensal;
  let saldo = saldoSelic, meses = 0;
  const maxMeses = 120;
  while (saldo < meta && meses < maxMeses) {
    saldo += sobraMensal;
    if (meses % 6 === 5) saldo += cupomSemestral;
    meses++;
    if (saldo < 0) break;
  }
  if (saldo < 0 || meses >= maxMeses) {
    el.innerHTML = `<span class="text-red-400">✗ Não recompõe em 10 anos.</span> Déficit: ${formatarMoeda(deficit)}.`;
  } else {
    el.innerHTML = `Déficit: <strong>${formatarMoeda(deficit)}</strong> · Sobra: ${formatarMoeda(sobraMensal)} · Cupom: ${formatarMoeda(cupomSemestral)}/sem.<br>
      <span class="text-emerald-400 font-bold">Recomposição em ~${meses} meses (${(meses/12).toFixed(1)} anos)</span>`;
  }
}

/* =========================================================
   DIAGNÓSTICO
========================================================= */
function avaliarRegraAcao(saqueMensal, sobraAnual, saldoSelic, metaSelic, resgateBruto, rendTotalLiq, pisoSaque) {
  const banner = document.getElementById('action-banner'), title = document.getElementById('action-title'),
        desc = document.getElementById('action-desc'), rec = document.getElementById('rec-saque');
  document.getElementById('painel-ajuste').classList.add('hidden');

  if (pisoSaque > 0 && saqueMensal < pisoSaque) {
    banner.className = 'card-glass rounded-2xl p-5 sm:p-6 shadow-xl border-l-4 border-rose-500 bg-rose-950/20';
    title.textContent = '⚠ ABAIXO DO PISO';
    title.className = 'text-xl sm:text-2xl font-bold text-rose-400 mt-1';
    desc.innerHTML = `Saque de <strong>${formatarMoeda(saqueMensal)}</strong> está abaixo do piso <strong>${formatarMoeda(pisoSaque)}</strong>.`;
    rec.textContent = 'Subir para ' + formatarMoeda(pisoSaque);
    rec.className = 'text-base sm:text-lg font-bold text-rose-400';
    return;
  }
  if (saldoSelic < metaSelic) {
    const def = metaSelic - saldoSelic;
    banner.className = 'card-glass rounded-2xl p-5 sm:p-6 shadow-xl border-l-4 border-amber-500 bg-amber-950/20';
    title.textContent = '⚠ RECOMPOR RESERVA SELIC';
    title.className = 'text-xl sm:text-2xl font-bold text-amber-400 mt-1';
    desc.innerHTML = `Selic em <strong>${formatarMoeda(saldoSelic)}</strong> · faltam <strong>${formatarMoeda(def)}</strong> para a meta.`;
    rec.textContent = 'Manter R$ ' + (saqueMensal/1000).toFixed(0) + 'k/mês';
    rec.className = 'text-base sm:text-lg font-bold text-amber-400';
    return;
  }
  if (sobraAnual < 0) {
    banner.className = 'card-glass rounded-2xl p-5 sm:p-6 shadow-xl border-l-4 border-red-500 bg-red-950/20';
    title.textContent = '✗ REDUZIR SAQUE MENSAL';
    title.className = 'text-xl sm:text-2xl font-bold text-red-400 mt-1';
    const saqueMax = rendTotalLiq / 12;
    desc.innerHTML = `Rendimento líquido <strong>${formatarMoeda(rendTotalLiq)}/ano</strong> não cobre saques de <strong>${formatarMoeda(saqueMensal*12)}/ano</strong>.`;
    rec.textContent = 'Máx: ' + formatarMoeda(saqueMax);
    rec.className = 'text-base sm:text-lg font-bold text-red-400';
    return;
  }
  if (saqueMensal >= 250000 && sobraAnual >= 0) {
    banner.className = 'card-glass rounded-2xl p-5 sm:p-6 shadow-xl border-l-4 border-indigo-500 bg-indigo-950/20';
    title.textContent = '✓ TETO LIBERADO (não garantido)';
    title.className = 'text-xl sm:text-2xl font-bold text-indigo-300 mt-1';
    desc.textContent = 'Carteira sustenta o teto hoje. Monitorar revisão anual BTG.';
    rec.textContent = 'Aprovado R$ 250.000';
    rec.className = 'text-base sm:text-lg font-bold text-indigo-400';
    return;
  }
  banner.className = 'card-glass rounded-2xl p-5 sm:p-6 shadow-xl border-l-4 border-emerald-500 bg-emerald-950/20';
  title.textContent = '✓ CENÁRIO ESTÁVEL';
  title.className = 'text-xl sm:text-2xl font-bold text-emerald-400 mt-1';
  desc.textContent = 'Liquidez e rendimentos equilibrados.';
  rec.textContent = 'Manter R$ ' + (saqueMensal/1000).toFixed(0) + 'k/mês';
  rec.className = 'text-base sm:text-lg font-bold text-emerald-400';
}

/* =========================================================
   GRÁFICOS
========================================================= */
function initCharts() {
  if (typeof Chart === 'undefined') return;
  const ctx1 = document.getElementById('chartPatrimonio')?.getContext('2d');
  if (ctx1 && !chartAlocacao) {
    chartAlocacao = new Chart(ctx1, { type:'bar', data:{ labels:['Selic','Meta','IPCA+'], datasets:[{ label:'R$', data:[12000000,12000000,20000000], backgroundColor:['rgba(56,189,248,.7)','rgba(99,102,241,.4)','rgba(168,85,247,.7)'], borderColor:['#38bdf8','#6366f1','#a855f7'], borderWidth:1.5, borderRadius:8 }] },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: c => ' ' + formatarMoeda(c.raw) } } }, scales:{ y:{ ticks:{ color:'#94a3b8', callback: v => 'R$ ' + (v/1e6).toFixed(1) + 'M' }, grid:{ color:'rgba(255,255,255,.05)' } }, x:{ ticks:{ color:'#94a3b8' }, grid:{display:false} } } } });
  }
  const ctx2 = document.getElementById('chartProjecao')?.getContext('2d');
  if (ctx2 && !chartProjecao) {
    chartProjecao = new Chart(ctx2, { type:'line', data:{ labels:[], datasets:[ { label:'Selic', data:[], borderColor:'#38bdf8', backgroundColor:'rgba(56,189,248,.1)', fill:true, tension:.3, pointRadius:0 }, { label:'Meta', data:[], borderColor:'#f59e0b', borderDash:[5,5], pointRadius:0, fill:false } ] },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ labels:{ color:'#cbd5e1', font:{size:10} } }, tooltip:{ callbacks:{ label: c => c.dataset.label + ': ' + formatarMoeda(c.raw) } } }, scales:{ y:{ ticks:{ color:'#94a3b8', callback: v => 'R$ ' + (v/1e6).toFixed(1) + 'M' }, grid:{ color:'rgba(255,255,255,.05)' } }, x:{ ticks:{ color:'#94a3b8', maxTicksLimit:12 }, grid:{display:false} } } } });
  }
}
function atualizarGrafico(saldoSelic, meta, selicBase, ipcaBase) {
  try {
    if (chartAlocacao) { chartAlocacao.data.datasets[0].data = [saldoSelic, meta, ipcaBase]; chartAlocacao.update('none'); }
    if (!estado || !chartProjecao) return;
    const inputs = estado.inputs;
    const rentSelicAnual = (selicBase || CFG.SELIC_INICIAL) * (inputs.rentSelic / 100);
    const ipcaProjetado = dadosBCB.ipca || CFG.FALLBACK.ipca;
    const rentIPCAReal = Math.max(0, ((1 + inputs.rentIPCA/100) / (1 + ipcaProjetado/100)) - 1);
    const cupom = calcularCupomIPCA(ipcaBase || CFG.TESOURO_IPCA, rentIPCAReal);
    const saqueMensal = inputs.saqueSelect === 'custom' ? inputs.saqueCustom : parseFloat(inputs.saqueSelect);
    const resgateBrutoMensal = saqueMensal * 1.02;
    let saldo = saldoSelic;
    const labels = [], data = [], metaLine = [];
    const dataBase = inputs.dataBase ? new Date(inputs.dataBase + 'T12:00:00') : new Date();
    for (let m = 0; m <= 24; m++) {
      const d = new Date(dataBase); d.setMonth(d.getMonth() + m);
      labels.push(d.toLocaleDateString('pt-BR', { month:'short', year:'2-digit' }));
      data.push(Math.max(0, saldo)); metaLine.push(meta);
      saldo += rentSelicAnual / 12;
      if (m % 6 === 5) saldo += cupom;
      saldo -= resgateBrutoMensal;
      if (saldo < 0) saldo = 0;
    }
    chartProjecao.data.labels = labels;
    chartProjecao.data.datasets[0].data = data;
    chartProjecao.data.datasets[1].data = metaLine;
    chartProjecao.update('none');
  } catch (e) { console.error('[atualizarGrafico]', e); }
}

/* =========================================================
   UTILITÁRIOS
========================================================= */
function formatarMoeda(v) {
  if (!isFinite(v)) return 'R$ 0';
  return new Intl.NumberFormat('pt-BR', { style:'currency', currency:'BRL', maximumFractionDigits:0 }).format(v);
}
function carregarExemploPDF() {

function abrirConfig() { document.getElementById('modal-config').classList.remove('hidden'); }

/* =========================================================
   INIT  — ORDEM CORRETA: charts primeiro, depois simulação
========================================================= */
document.addEventListener('DOMContentLoaded', () => {
  try {
    const hoje = new Date().toISOString().slice(0,10);
    const dbEl = document.getElementById('input-data-base');
    const daEl = document.getElementById('input-data-aporte');
    if (dbEl && !dbEl.value) dbEl.value = hoje;
    if (daEl && !daEl.value) daEl.value = hoje;

    const salvo = carregarEstado();
    if (salvo) aplicarInputs(salvo);

    // 1) Charts primeiro (não dependem de estado)
    initCharts();

    // 2) Simulação (depende dos charts já existirem)
    atualizarSimulacao();
    renderizarDecisoes();

    // 3) Listeners
    document.getElementById('select-saque').addEventListener('change', e => {
      document.getElementById('div-saque-custom').classList.toggle('hidden', e.target.value !== 'custom');
      atualizarSimulacao();
    });

    const idsInput = ['input-patrimonio','input-ja-investido','input-selic-inicial','input-ipca-inicial',
      'input-data-base','input-data-aporte','input-rent-selic','input-taxa-real-ipca','input-rent-ipca',
      'input-custo-btg','input-ir-efetivo','input-saque-custom','input-piso-saque','input-meta-selic',
      'input-rateio-casa','input-rateio-esposa','input-rateio-marido',
      'input-extra-imovel','input-extra-outros','input-reserva-emergencia'];

    idsInput.forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('input', () => {
        if (!estado) estado = { inputs: {} };
        if (id === 'input-taxa-real-ipca') recalcularIPCANominal();
        if (id === 'input-rent-selic' || id === 'input-taxa-real-ipca' || id === 'input-rent-ipca') {
          document.getElementById('val-rent-selic').textContent = parseFloat(document.getElementById('input-rent-selic').value).toFixed(1) + '%';
          document.getElementById('val-taxa-real-ipca').textContent = parseFloat(document.getElementById('input-taxa-real-ipca').value).toFixed(1) + '%';
          document.getElementById('val-rent-ipca').textContent = parseFloat(document.getElementById('input-rent-ipca').value).toFixed(1) + '%';
        }
        if (id === 'input-patrimonio' || id === 'input-selic-inicial' || id === 'input-ipca-inicial') atualizarSomaAlocada();
        if (id.startsWith('input-rateio')) atualizarRateioInfo();
        atualizarSimulacao();
      });
    });

    // 4) Rede (não bloqueia)
    registrarSW();
    atualizarDadosBCB();
  } catch (e) {
    console.error('[init] erro fatal:', e);
    document.getElementById('action-title').textContent = 'Erro ao carregar';
    document.getElementById('action-desc').textContent = e.message;
  }
});
